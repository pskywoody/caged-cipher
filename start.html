<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data:;
    audio-src 'self' blob:;
    connect-src 'self';
    frame-src 'none';
    object-src 'none';
    base-uri 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 全局错误边界（必须放在所有脚本之前） -->
  <script>
  (function() {
    'use strict';

    // 标记：是否已经显示过致命错误（防止重复刷屏）
    var _fatalErrorShown = false;

    // 致命错误降级 UI
    function showFatalError(msg, error) {
      if (_fatalErrorShown) return;
      _fatalErrorShown = true;

      try {
        var container = document.getElementById('game-container')
                      || document.getElementById('app')
                      || document.body;

        // 收集错误信息
        var errorInfo = {
          message: msg,
          url: (error && error.fileName) || (window.location && window.location.href),
          line: (error && error.lineNumber) || 'unknown',
          stack: (error && error.stack) || 'no stack',
          time: new Date().toISOString()
        };

        // 尝试保存错误信息到 localStorage
        try {
          var logs = JSON.parse(localStorage.getItem('caged_cipher_fatal_errors') || '[]');
          logs.unshift(errorInfo);
          logs = logs.slice(0, 5); // 最多存 5 条
          localStorage.setItem('caged_cipher_fatal_errors', JSON.stringify(logs));
        } catch(e) {}

        // 显示友好的错误界面（侦探案卷风格）
        container.innerHTML =
          '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
          'background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:20px;">' +
            '<div style="max-width:400px;width:100%;background:#1e293b;border:2px solid #fbbf24;' +
            'border-radius:12px;padding:32px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);">' +
              '<div style="font-size:56px;margin-bottom:16px;">🕵️</div>' +
              '<div style="font-size:20px;font-weight:700;color:#fbbf24;margin-bottom:8px;">案卷损坏</div>' +
              '<div style="font-size:14px;color:#94a3b8;margin-bottom:24px;line-height:1.6;">' +
                '侦探先生，系统遇到了一个小问题。<br>请尝试重新加载页面。' +
              '</div>' +
              '<button onclick="location.reload()" style="padding:12px 32px;background:#fbbf24;color:#0f172a;' +
              'border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;' +
              'transition:transform 0.1s;" onmousedown="this.style.transform=\'scale(0.97)\'" ' +
              'onmouseup="this.style.transform=\'scale(1)\'">重新加载</button>' +
              '<div style="margin-top:20px;font-size:12px;color:#475569;word-break:break-all;' +
              'text-align:left;background:#0f172a;padding:12px;border-radius:6px;max-height:120px;overflow:auto;">' +
                '<div style="color:#64748b;margin-bottom:4px;">错误信息：</div>' +
                msg + ' (line ' + errorInfo.line + ')' +
              '</div>' +
            '</div>' +
          '</div>';
      } catch(e) {
        // 连错误 UI 都渲染失败了，只能 alert
        try { alert('系统出错了，请刷新页面。\n' + msg); } catch(e2) {}
      }
    }

    // JS 运行时错误
    window.onerror = function(msg, url, line, col, error) {
      console.error('[FATAL ERROR]', msg, 'at', url, ':', line, ':', col);
      if (error && error.stack) console.error(error.stack);

      // 只在主页面显示致命错误UI
      // 某些非致命错误（如资源加载失败）不触发
      showFatalError(msg, error);
      return true; // 阻止默认错误处理
    };

    // 未处理的 Promise 错误
    window.addEventListener('unhandledrejection', function(e) {
      console.warn('[UNHANDLED REJECTION]', e.reason);
      // Promise 错误不显示致命错误 UI（降级处理，只记录）
      // 因为很多 Promise 错误可能是网络问题，不影响主流程
      try {
        var logs = JSON.parse(localStorage.getItem('caged_cipher_fatal_errors') || '[]');
        logs.unshift({
          type: 'unhandledrejection',
          message: (e.reason && e.reason.message) || String(e.reason),
          stack: (e.reason && e.reason.stack) || '',
          time: new Date().toISOString()
        });
        logs = logs.slice(0, 5);
        localStorage.setItem('caged_cipher_fatal_errors', JSON.stringify(logs));
      } catch(err) {}
    });

    // 资源加载失败（图片/脚本/样式等）
    window.addEventListener('error', function(e) {
      if (e.target !== window && e.target !== document) {
        console.warn('[RESOURCE ERROR] 资源加载失败:',
          e.target && e.target.src ? e.target.src :
          e.target && e.target.href ? e.target.href : 'unknown');
      }
    }, true); // 捕获阶段才能拿到资源错误

  })();
  </script>
  <title>Caged Cipher · 笼中密码</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ============================================
       启动页 · 侦探案卷夹 · 牛皮封面 · 翻页动画
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; overflow: hidden; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(60, 45, 30, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(40, 30, 20, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(50, 38, 28, 0.3) 0%, transparent 70%),
        #0d0907;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
      padding: 20px;
    }

    /* 书的容器 — 设置透视 */
    .book-container {
      width: 100%;
      max-width: 420px;
      height: 600px;
      max-height: 85vh;
      position: relative;
      perspective: 2000px;
      perspective-origin: 50% 50%;
    }

    /* 书脊 — 中间的装订线 */
    .book-spine {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 8px;
      height: 100%;
      background:
        linear-gradient(90deg,
          rgba(0, 0, 0, 0.6) 0%,
          rgba(0, 0, 0, 0.2) 30%,
          rgba(20, 15, 10, 0.3) 50%,
          rgba(0, 0, 0, 0.2) 70%,
          rgba(0, 0, 0, 0.6) 100%);
      z-index: 10;
      pointer-events: none;
      border-radius: 1px;
    }

    /* 书脊上的烫金线 */
    .book-spine::before,
    .book-spine::after {
      content: '';
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 30px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(201, 168, 76, 0.3) 20%,
        rgba(201, 168, 76, 0.5) 50%,
        rgba(201, 168, 76, 0.3) 80%,
        transparent 100%);
    }
    .book-spine::before { top: 50px; }
    .book-spine::after { bottom: 50px; }

    /* 封面通用样式 */
    .cover-half {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
    }

    .cover-half.left {
      left: 0;
      transform-origin: right center;
    }

    .cover-half.right {
      right: 0;
      transform-origin: left center;
    }

    /* 翻页状态 */
    .book-container.opening .cover-half.left {
      transform: rotateY(-180deg);
    }

    .book-container.opening .cover-half.right {
      transform: rotateY(180deg);
    }

    /* 点击时书本轻微下压 */
    .book-container.pressed {
      transform: scale(0.98) translateY(4px);
    }

    /* 翻页时整体光线变亮 — 模拟书本翻开的感觉 */
    .book-container.opening {
      filter: brightness(1.15);
      transition: filter 0.6s ease 0.3s;
    }

    .book-container {
      transition: filter 0.3s ease, transform 0.15s ease;
    }

    /* 封面的正面和背面 */
    .cover-face {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 8px;
      overflow: hidden;
    }

    /* 正面 — 牛皮封面 */
    .cover-face.front {
      background:
        /* 边角磨损阴影 */
        radial-gradient(ellipse at 0% 0%, rgba(0, 0, 0, 0.3) 0%, transparent 30%),
        radial-gradient(ellipse at 100% 0%, rgba(0, 0, 0, 0.25) 0%, transparent 25%),
        radial-gradient(ellipse at 0% 100%, rgba(0, 0, 0, 0.25) 0%, transparent 28%),
        radial-gradient(ellipse at 100% 100%, rgba(0, 0, 0, 0.3) 0%, transparent 30%),
        /* 皮革高光 */
        radial-gradient(ellipse at 35% 25%, rgba(120, 95, 70, 0.2) 0%, transparent 45%),
        radial-gradient(ellipse at 65% 75%, rgba(80, 62, 48, 0.15) 0%, transparent 40%),
        /* 底色渐变 */
        linear-gradient(160deg, #3d322a 0%, #2a211c 40%, #241b16 70%, #1a1310 100%);
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.7),
        0 4px 12px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(201, 168, 76, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(201, 168, 76, 0.15);
    }

    /* 左封面正面 — 右边缘有书脊阴影 */
    .cover-half.left .cover-face.front {
      border-radius: 8px 0 0 8px;
      border-right: none;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset -2px 0 8px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(201, 168, 76, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    }

    /* 右封面正面 — 左边缘有书脊阴影 */
    .cover-half.right .cover-face.front {
      border-radius: 0 8px 8px 0;
      border-left: none;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 2px 0 8px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(201, 168, 76, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3);
    }

    /* 皮革纹理层 */
    .cover-face.front::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(42deg,
          transparent 0px, transparent 2px,
          rgba(0, 0, 0, 0.06) 2px, rgba(0, 0, 0, 0.06) 3px,
          transparent 3px, transparent 5px),
        repeating-linear-gradient(-42deg,
          transparent 0px, transparent 2px,
          rgba(0, 0, 0, 0.03) 2px, rgba(0, 0, 0, 0.03) 3px,
          transparent 3px, transparent 5px),
        repeating-linear-gradient(0deg,
          transparent 0px, transparent 4px,
          rgba(0, 0, 0, 0.02) 4px, rgba(0, 0, 0, 0.02) 5px);
      pointer-events: none;
    }

    /* 内边框装饰 — 金色双线 */
    .cover-face.front::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(201, 168, 76, 0.2);
      border-radius: 4px;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 3px transparent,
        inset 0 0 0 4px rgba(201, 168, 76, 0.06);
    }

    /* 背面 — 内页（米色纸张质感） */
    .cover-face.back {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(180, 160, 130, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 80%, rgba(140, 120, 90, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #d4c4a8 0%, #c4b59a 50%, #b8a88a 100%);
      transform: rotateY(180deg);
    }

    .cover-half.left .cover-face.back {
      border-radius: 0 8px 8px 0;
      box-shadow:
        inset 2px 0 8px rgba(0, 0, 0, 0.15),
        inset -1px 0 0 rgba(201, 168, 76, 0.2);
    }

    .cover-half.right .cover-face.back {
      border-radius: 8px 0 0 8px;
      box-shadow:
        inset -2px 0 8px rgba(0, 0, 0, 0.15),
        inset 1px 0 0 rgba(201, 168, 76, 0.2);
    }

    /* 内页纸张纹理 */
    .cover-face.back::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg,
          transparent 0px, transparent 8px,
          rgba(139, 115, 85, 0.03) 8px, rgba(139, 115, 85, 0.03) 9px),
        repeating-linear-gradient(90deg,
          transparent 0px, transparent 20px,
          rgba(139, 115, 85, 0.02) 20px, rgba(139, 115, 85, 0.02) 21px);
      pointer-events: none;
    }

    /* 内页装饰 — 顶部的装订线 */
    .cover-face.back::after {
      content: '';
      position: absolute;
      top: 30px;
      left: 20px;
      right: 20px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(139, 115, 85, 0.3) 20%,
        rgba(139, 115, 85, 0.3) 80%,
        transparent 100%);
    }

    /* ============================================
       封面内容 — 左右两半共享
       ============================================ */

    /* 装饰角标 */
    .corner-mark {
      position: absolute;
      font-size: 14px;
      color: rgba(201, 168, 76, 0.4);
      letter-spacing: 2px;
      z-index: 5;
      text-shadow: 0 0 8px rgba(201, 168, 76, 0.3);
    }

    /* 左半部分的角标 */
    .cover-half.left .corner-mark.tl { top: 20px; left: 26px; }
    .cover-half.left .corner-mark.bl { bottom: 20px; left: 26px; }

    /* 右半部分的角标 */
    .cover-half.right .corner-mark.tr { top: 20px; right: 26px; }
    .cover-half.right .corner-mark.br { bottom: 20px; right: 26px; }

    /* 顶部徽章 — 只在右半显示锁的右半，左半显示左半 */
    .cover-badge {
      position: absolute;
      top: 60px;
      font-size: 36px;
      z-index: 5;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      animation: badgeFloat 4s ease-in-out infinite;
    }

    .cover-half.left .cover-badge {
      right: -2px;
      clip-path: inset(0 50% 0 0);
    }

    .cover-half.right .cover-badge {
      left: -2px;
      clip-path: inset(0 0 0 50%);
    }

    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 标题区 — 分为左右两半 */
    .title-section {
      position: absolute;
      top: 50%;
      transform: translateY(-55%);
      width: 100%;
      z-index: 5;
      text-align: center;
    }

    /* 烫金英文标题 */
    .logo-en {
      font-family: "Times New Roman", "Georgia", "Noto Serif SC", serif;
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(180deg,
        #f5e6a8 0%,
        #e6d078 20%,
        #c9a84c 45%,
        #a8882f 65%,
        #d4b86a 80%,
        #f0de96 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #c9a84c;
      text-shadow:
        0 1px 0 rgba(255, 240, 180, 0.3),
        0 -1px 0 rgba(120, 80, 20, 0.4),
        0 2px 4px rgba(0, 0, 0, 0.5),
        0 4px 8px rgba(0, 0, 0, 0.3),
        0 0 30px rgba(201, 168, 76, 0.2);
      letter-spacing: 6px;
      line-height: 1.3;
      position: relative;
      animation: titleGlow 3s ease-in-out infinite alternate;
      white-space: nowrap;
    }

    /* 左半标题 — 只显示左半边 */
    .cover-half.left .logo-en {
      text-align: right;
      padding-right: 4px;
      clip-path: inset(0 0 0 0);
      /* 让文字从右边开始 */
      direction: rtl;
    }

    /* 右半标题 — 只显示右半边 */
    .cover-half.right .logo-en {
      text-align: left;
      padding-left: 4px;
      clip-path: inset(0 0 0 0);
    }

    @keyframes titleGlow {
      from { filter: drop-shadow(0 0 6px rgba(201, 168, 76, 0.3)); }
      to { filter: drop-shadow(0 0 20px rgba(201, 168, 76, 0.6)); }
    }

    /* 中文副标题 */
    .logo-zh {
      font-family: "Georgia", "KaiTi", "STKaiti", "Noto Serif SC", serif;
      font-size: 18px;
      color: #d4b86a;
      letter-spacing: 6px;
      margin-top: 14px;
      text-shadow:
        0 1px 2px rgba(0, 0, 0, 0.5),
        0 0 12px rgba(201, 168, 76, 0.25);
      white-space: nowrap;
    }

    .cover-half.left .logo-zh {
      text-align: right;
      padding-right: 10px;
    }

    .cover-half.right .logo-zh {
      text-align: left;
      padding-left: 10px;
    }

    /* 分隔线 */
    .divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201, 168, 76, 0.15) 20%,
        rgba(201, 168, 76, 0.4) 50%,
        rgba(201, 168, 76, 0.15) 80%,
        transparent 100%);
      margin: 20px auto 0;
      position: relative;
    }

    .cover-half.left .divider {
      margin-right: 16px;
    }

    .cover-half.right .divider {
      margin-left: 16px;
    }

    .divider::before {
      content: '✦';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: rgba(201, 168, 76, 0.5);
      background: transparent;
      padding: 0 6px;
    }

    /* 底部提示文字 */
    .tap-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      text-align: center;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* 翻页时提示文字淡出下移 */
    .book-container.opening .tap-hint {
      opacity: 0;
      transform: translateX(-50%) translateY(10px);
    }

    .tap-hint-text {
      font-size: 12px;
      color: rgba(201, 168, 76, 0.5);
      letter-spacing: 4px;
      font-family: "Georgia", "KaiTi", "STKaiti", serif;
      animation: breathe 2.5s ease-in-out infinite;
      text-shadow: 0 0 8px rgba(201, 168, 76, 0.2);
    }

    .tap-hint-arrow {
      font-size: 16px;
      color: rgba(201, 168, 76, 0.4);
      margin-top: 6px;
      animation: arrowBounce 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.4;
        text-shadow: 0 0 4px rgba(201, 168, 76, 0.1);
      }
      50% {
        opacity: 0.9;
        text-shadow: 0 0 16px rgba(201, 168, 76, 0.4);
      }
    }

    @keyframes arrowBounce {
      0%, 100% {
        transform: translateY(0);
        opacity: 0.4;
      }
      50% {
        transform: translateY(4px);
        opacity: 0.8;
      }
    }

    /* 底部档案号 */
    .footer-mark {
      position: absolute;
      bottom: 24px;
      font-size: 10px;
      color: rgba(201, 168, 76, 0.3);
      letter-spacing: 2px;
      font-family: "Courier New", monospace;
      z-index: 5;
    }

    .cover-half.left .footer-mark {
      left: 26px;
    }

    .cover-half.right .footer-mark {
      right: 26px;
    }

    /* ============================================
       内页背面的装饰文字
       ============================================ */
    .back-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      transition: opacity 0.6s ease 0.4s;
    }

    .book-container.opening .back-content {
      opacity: 1;
    }

    .back-seal {
      font-size: 48px;
      opacity: 0.15;
      filter: sepia(0.5);
    }

    .back-text {
      font-family: "KaiTi", "STKaiti", "Noto Serif SC", serif;
      font-size: 14px;
      color: rgba(100, 80, 50, 0.4);
      margin-top: 12px;
      letter-spacing: 4px;
    }

    /* ============================================
       入场动画
       ============================================ */
    .book-container {
      opacity: 0;
      transform: scale(0.9) translateY(20px);
      animation: bookEnter 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
    }

    @keyframes bookEnter {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ============================================
       书的阴影 — 增强立体感
       ============================================ */
    .book-shadow {
      position: absolute;
      bottom: -20px;
      left: 10%;
      width: 80%;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, transparent 70%);
      filter: blur(10px);
      z-index: -1;
      animation: shadowEnter 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
      opacity: 0;
    }

    @keyframes shadowEnter {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ============================================
       响应式
       ============================================ */
    @media (max-width: 480px) {
      .book-container {
        max-width: 360px;
        height: 560px;
        max-height: 82vh;
      }
      .logo-en { font-size: 26px; letter-spacing: 4px; }
      .logo-zh { font-size: 15px; letter-spacing: 4px; }
      .cover-badge { font-size: 32px; top: 50px; }
      .corner-mark { font-size: 12px; }
      .cover-half.left .corner-mark.tl { top: 18px; left: 22px; }
      .cover-half.left .corner-mark.bl { bottom: 18px; left: 22px; }
      .cover-half.right .corner-mark.tr { top: 18px; right: 22px; }
      .cover-half.right .corner-mark.br { bottom: 18px; right: 22px; }
      .tap-hint { bottom: 32px; }
      .tap-hint-text { font-size: 11px; letter-spacing: 3px; }
      .footer-mark { font-size: 9px; }
      .cover-half.left .footer-mark { left: 22px; }
      .cover-half.right .footer-mark { right: 22px; bottom: 22px; }
    }

    @media (max-height: 600px) {
      .book-container {
        max-height: 80vh;
        height: 480px;
      }
      .cover-badge { font-size: 28px; top: 40px; }
      .logo-en { font-size: 24px; }
      .logo-zh { font-size: 14px; margin-top: 10px; }
      .divider { margin-top: 14px; }
      .tap-hint { bottom: 28px; }
    }

    /* 横屏适配 */
    @media (orientation: landscape) and (max-height: 500px) {
      .book-container {
        max-width: 320px;
        height: 420px;
        max-height: 85vh;
      }
      .cover-badge { font-size: 24px; top: 30px; }
      .logo-en { font-size: 22px; letter-spacing: 3px; }
      .logo-zh { font-size: 13px; letter-spacing: 3px; margin-top: 8px; }
      .tap-hint { bottom: 24px; }
      .tap-hint-text { font-size: 10px; }
    }
  </style>
</head>
<body>
  <!-- 页面转场遮罩 -->
  <div id="page-transition-overlay" class="page-transition-overlay"></div>
  <div class="book-container page-transition-root page-enter" id="book">
    <!-- 书的阴影 -->
    <div class="book-shadow"></div>

    <!-- 左半封面 -->
    <div class="cover-half left">
      <div class="cover-face front">
        <span class="corner-mark tl">✦</span>
        <span class="corner-mark bl">✦</span>
        <div class="cover-badge">🔒</div>
        <div class="title-section">
          <div class="logo-en">CAGED</div>
          <div class="logo-zh">「 笼 中</div>
          <div class="divider"></div>
        </div>
        <div class="footer-mark">CC-001</div>
      </div>
      <div class="cover-face back">
        <div class="back-content">
          <div class="back-seal">📜</div>
          <div class="back-text">档案 · 机密</div>
        </div>
      </div>
    </div>

    <!-- 书脊 -->
    <div class="book-spine"></div>

    <!-- 右半封面 -->
    <div class="cover-half right">
      <div class="cover-face front">
        <span class="corner-mark tr">✦</span>
        <span class="corner-mark br">✦</span>
        <div class="cover-badge">🔒</div>
        <div class="title-section">
          <div class="logo-en">CIPHER</div>
          <div class="logo-zh">密 码 」</div>
          <div class="divider"></div>
        </div>
        <div class="footer-mark">v1.0.0</div>
      </div>
      <div class="cover-face back">
        <div class="back-content">
          <div class="back-seal">🔍</div>
          <div class="back-text">调查 · 开始</div>
        </div>
      </div>
    </div>

    <!-- 底部点击提示（跨越整本书） -->
    <div class="tap-hint">
      <div class="tap-hint-text">点 击 翻 开</div>
      <div class="tap-hint-arrow">⌄</div>
    </div>
  </div>

  <script>
    (function() {
      const book = document.getElementById('book');
      let isOpening = false;
      let audio = null;

      // 页面进入动画（从其他页面返回时）
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (book) {
            book.classList.add('page-enter-active');
            setTimeout(() => {
              book.classList.remove('page-enter', 'page-enter-active');
            }, 550);
          }
        });
      });

      // 尝试播放翻书音效
      function playFlipSound() {
        try {
          audio = new Audio('assets/audio/sfx/book_flip.wav');
          audio.volume = 0.6;
          audio.play().catch(function() {
            // 自动播放被阻止时忽略
          });
        } catch(e) {}
      }

      // 触发翻页动画
      function openBook() {
        if (isOpening) return;
        isOpening = true;

        // 下压效果
        book.classList.add('pressed');

        // 短暂延迟后开始翻页
        setTimeout(function() {
          book.classList.remove('pressed');
          // 播放翻页音效
          playFlipSound();
          // 添加翻页动画类
          book.classList.add('opening');
        }, 120);

        // 动画结束后跳转到 menu.html
        setTimeout(function() {
          window.location.href = 'menu.html';
        }, 1250);
      }

      // 点击任意位置触发
      document.addEventListener('click', openBook);
      document.addEventListener('touchstart', function(e) {
        // 防止双触发（click 和 touchstart 都触发）
        if (isOpening) {
          e.preventDefault();
          return;
        }
        e.preventDefault();
        openBook();
      }, { passive: false });

      // 键盘任意键触发
      document.addEventListener('keydown', function(e) {
        // 忽略一些功能键
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        openBook();
      });
    })();
  </script>
</body>
</html>
